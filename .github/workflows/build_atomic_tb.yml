name: Build Atomic DTW Tablebase

on:
  workflow_dispatch:
    inputs:
      table:
        description: 'Table to solve (e.g. KRPvKQ), or "ALL_5P_1P" (all 26), "5P_1P_BATCH1", "5P_1P_BATCH2", "5P_1P_BLACK", "ALL_5P_QUEEN", "ALL_5P_0P", "ALL_4P"'
        required: true
        default: 'ALL_5P_1P'

concurrency:
  group: "build-atomic-tb-${{ github.event.inputs.table }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  setup:
    name: Setup Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          INPUT="${{ github.event.inputs.table }}"
          if [ "$INPUT" = "ALL_5P_1P" ]; then
            echo 'matrix=["KQPvKQ","KQPvKR","KQPvKB","KQPvKN","KRPvKQ","KRPvKR","KRPvKB","KRPvKN","KBPvKQ","KBPvKR","KBPvKB","KBPvKN","KNPvKQ","KNPvKR","KNPvKB","KNPvKN","KQQvKP","KQRvKP","KQBvKP","KQNvKP","KRRvKP","KRBvKP","KRNvKP","KBBvKP","KBNvKP","KNNvKP"]' >> $GITHUB_OUTPUT
          elif [ "$INPUT" = "5P_1P_BATCH1" ]; then
            echo 'matrix=["KQPvKQ","KQPvKR","KQPvKB","KQPvKN","KRPvKQ","KRPvKR","KRPvKB","KRPvKN"]' >> $GITHUB_OUTPUT
          elif [ "$INPUT" = "5P_1P_BATCH2" ]; then
            echo 'matrix=["KBPvKQ","KBPvKR","KBPvKB","KBPvKN","KNPvKQ","KNPvKR","KNPvKB","KNPvKN"]' >> $GITHUB_OUTPUT
          elif [ "$INPUT" = "5P_1P_BLACK" ] || [ "$INPUT" = "5P_1P_BATCH3" ]; then
            echo 'matrix=["KQQvKP","KQRvKP","KQBvKP","KQNvKP","KRRvKP","KRBvKP","KRNvKP","KBBvKP","KBNvKP","KNNvKP"]' >> $GITHUB_OUTPUT
          elif [ "$INPUT" = "ALL" ] || [ "$INPUT" = "ALL_4P" ]; then
            echo 'matrix=["KQPvK","KRPvK","KBPvK","KNPvK","KQvKP","KRvKP","KBvKP","KNvKP"]' >> $GITHUB_OUTPUT
          elif [ "$INPUT" = "ALL_5P_QUEEN" ] || [ "$INPUT" = "ALL_5P_QUEENS" ]; then
            echo 'matrix=["KQQvKQ","KQQvKR","KQQvKB","KQQvKN","KQRvKQ","KQRvKR","KQRvKB","KQRvKN","KQBvKQ","KQBvKR","KQBvKB","KQBvKN","KQNvKQ","KQNvKR","KQNvKB","KQNvKN","KRRvKQ","KRBvKQ","KRNvKQ","KBBvKQ","KBNvKQ","KNNvKQ"]' >> $GITHUB_OUTPUT
          elif [ "$INPUT" = "QUEEN_BATCH1" ]; then
            echo 'matrix=["KQQvKQ","KQQvKR","KQQvKB","KQQvKN","KQRvKQ","KQRvKR","KQRvKB","KQRvKN"]' >> $GITHUB_OUTPUT
          elif [ "$INPUT" = "QUEEN_BATCH2" ]; then
            echo 'matrix=["KQBvKQ","KQBvKR","KQBvKB","KQBvKN","KQNvKQ","KQNvKR","KQNvKB","KQNvKN"]' >> $GITHUB_OUTPUT
          elif [ "$INPUT" = "QUEEN_BATCH3" ]; then
            echo 'matrix=["KRRvKQ","KRBvKQ","KRNvKQ","KBBvKQ","KBNvKQ","KNNvKQ"]' >> $GITHUB_OUTPUT
          elif [ "$INPUT" = "ALL_5P_0P" ] || [ "$INPUT" = "ALL_5P_MINORS" ]; then
            echo 'matrix=["KRRvKB","KRRvKN","KRBvKR","KRBvKB","KRBvKN","KRNvKR","KRNvKB","KRNvKN","KBBvKR","KBBvKB","KBBvKN","KBNvKR","KBNvKB","KBNvKN","KNNvKR","KNNvKB","KNNvKN"]' >> $GITHUB_OUTPUT
          elif [ "$INPUT" = "REMAINING_3" ] || [ "$INPUT" = "ROOK_ENDINGS" ]; then
            echo 'matrix=["KRBvKB","KRBvKN","KRNvKN"]' >> $GITHUB_OUTPUT
          elif [ "$INPUT" = "ALL_5P_L0" ]; then
            echo 'matrix=["KRRvKR","KQRvKR","KRBvKR","KRNvKR","KRRvKQ","KQRvKQ","KRBvKQ","KRNvKQ","KRRvKB","KQRvKB","KRBvKB","KRNvKB","KRRvKN","KQRvKN","KRBvKN","KRNvKN"]' >> $GITHUB_OUTPUT
          else
            echo "matrix=[\"$INPUT\"]" >> $GITHUB_OUTPUT
          fi

  build-tablebase:
    needs: setup
    name: Generate ${{ matrix.table }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        table: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            tool/atomic_tb_gen/target/
          key: cargo-atomic-tb-${{ runner.os }}-${{ hashFiles('tool/atomic_tb_gen/Cargo.lock') }}
          restore-keys: |
            cargo-atomic-tb-${{ runner.os }}-

      - name: Build Release Binary
        run: |
          cargo build --release --manifest-path tool/atomic_tb_gen/Cargo.toml

      - name: Install rclone, zstd, and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone zstd jq curl

      - name: Configure rclone via Fresh OAuth Token
        env:
          CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          if [ -n "$REFRESH_TOKEN" ] && [ -n "$CLIENT_ID" ]; then
            RESPONSE=$(curl -s -X POST https://oauth2.googleapis.com/token \
              -d "client_id=${CLIENT_ID}" \
              -d "client_secret=${CLIENT_SECRET}" \
              -d "refresh_token=${REFRESH_TOKEN}" \
              -d "grant_type=refresh_token")
            ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
            if [ -n "$ACCESS_TOKEN" ] && [ "$ACCESS_TOKEN" != "null" ]; then
              TOKEN_JSON=$(jq -c -n \
                --arg at "$ACCESS_TOKEN" \
                --arg rt "$REFRESH_TOKEN" \
                '{access_token: $at, token_type: "Bearer", refresh_token: $rt, expiry: "2030-01-01T00:00:00Z"}')
              printf "[gdrive]\ntype = drive\nscope = drive\nclient_id = %s\nclient_secret = %s\ntoken = %s\nroot_folder_id = %s\n" \
                "$CLIENT_ID" "$CLIENT_SECRET" "$TOKEN_JSON" "$FOLDER_ID" > ~/.config/rclone/rclone.conf
              echo "rclone configured successfully for Google Drive."
            else
              echo "WARNING: Could not refresh Google Drive token."
            fi
          fi

      - name: Create Tablebase Output Directory & Download Parents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/tablebases/atomic/temp
          PARENT=$(./tool/atomic_tb_gen/target/release/atomic_tb_gen --parent-table "${{ matrix.table }}" || true)
          if [ -n "$PARENT" ]; then
            echo "Table ${{ matrix.table }} requires 5-piece parent table: $PARENT"
            # First try downloading from Google Drive via rclone if configured
            if [ -f ~/.config/rclone/rclone.conf ]; then
              echo "Checking Google Drive for $PARENT.atbd..."
              rclone copy "gdrive:$PARENT.atbd" data/tablebases/atomic/ || true
            fi
            if [ ! -f "data/tablebases/atomic/$PARENT.atbd" ]; then
              echo "Downloading atomic-tb-$PARENT from 5-piece Queen run 42814860481..."
              gh run download 42814860481 -n "atomic-tb-$PARENT" -D data/tablebases/atomic/temp || true
            fi
          fi
          # Download 3-piece and 4-piece base tables if needed
          gh run download 42484601569 -D data/tablebases/atomic/temp || true
          gh run download 42481717145 -D data/tablebases/atomic/temp || true
          find data/tablebases/atomic/temp -name "*.atbd" -exec mv {} data/tablebases/atomic/ \; || true
          rm -rf data/tablebases/atomic/temp
          echo "Available tablebases on runner:"
          ls -lh data/tablebases/atomic/*.atbd || true

      - name: Check and Restore Checkpoint from Google Drive
        run: |
          if [ -f ~/.config/rclone/rclone.conf ]; then
            echo "Checking Google Drive for existing checkpoint: ${{ matrix.table }}.checkpoint.zst..."
            rclone copy "gdrive:${{ matrix.table }}.checkpoint.zst" data/tablebases/atomic/ || true
            if [ -f "data/tablebases/atomic/${{ matrix.table }}.checkpoint.zst" ]; then
              echo "Found compressed checkpoint! Decompressing with zstd..."
              zstd -d "data/tablebases/atomic/${{ matrix.table }}.checkpoint.zst" -o "data/tablebases/atomic/${{ matrix.table }}.checkpoint.bin"
              rm -f "data/tablebases/atomic/${{ matrix.table }}.checkpoint.zst"
              ls -lh "data/tablebases/atomic/${{ matrix.table }}.checkpoint.bin"
            fi
          fi

      - name: Run Retrograde Solver (with checkpoint & timeout limit)
        id: solve
        run: |
          set +e
          ./tool/atomic_tb_gen/target/release/atomic_tb_gen "${{ matrix.table }}" --max-hours 4.8 --resume
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 10 ]; then
            echo "Solver failed with unexpected exit code: $EXIT_CODE"
            exit $EXIT_CODE
          fi

      - name: Upload Tablebase Artifact (.atbd)
        if: steps.solve.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: atomic-tb-${{ matrix.table }}
          path: data/tablebases/atomic/${{ matrix.table }}.atbd
          retention-days: 90

      - name: Handle Completed Tablebase Sync to Google Drive
        if: steps.solve.outputs.exit_code == '0'
        env:
          CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          echo "Solver completed successfully! Syncing to Google Drive..."
          # Re-mint fresh OAuth token to avoid 1-hour expiration
          if [ -n "$REFRESH_TOKEN" ] && [ -n "$CLIENT_ID" ]; then
            RESPONSE=$(curl -s -X POST https://oauth2.googleapis.com/token \
              -d "client_id=${CLIENT_ID}" \
              -d "client_secret=${CLIENT_SECRET}" \
              -d "refresh_token=${REFRESH_TOKEN}" \
              -d "grant_type=refresh_token")
            ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
            if [ -n "$ACCESS_TOKEN" ] && [ "$ACCESS_TOKEN" != "null" ]; then
              TOKEN_JSON=$(jq -c -n \
                --arg at "$ACCESS_TOKEN" \
                --arg rt "$REFRESH_TOKEN" \
                '{access_token: $at, token_type: "Bearer", refresh_token: $rt, expiry: "2030-01-01T00:00:00Z"}')
              printf "[gdrive]\ntype = drive\nscope = drive\nclient_id = %s\nclient_secret = %s\ntoken = %s\nroot_folder_id = %s\n" \
                "$CLIENT_ID" "$CLIENT_SECRET" "$TOKEN_JSON" "$FOLDER_ID" > ~/.config/rclone/rclone.conf
            fi
          fi
          if [ -f ~/.config/rclone/rclone.conf ]; then
            if [ -f "data/tablebases/atomic/${{ matrix.table }}.atbd" ]; then
              rclone copy "data/tablebases/atomic/${{ matrix.table }}.atbd" gdrive: --verbose
              # Clean up any leftover checkpoint on Google Drive
              rclone delete "gdrive:${{ matrix.table }}.checkpoint.zst" || true
            fi
          fi

      - name: Handle Checkpoint (Exit Code 10)
        if: steps.solve.outputs.exit_code == '10'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          echo "Solver exited with status 10 (checkpoint saved). Compressing and saving..."
          # Re-mint fresh OAuth token to avoid 1-hour expiration
          if [ -n "$REFRESH_TOKEN" ] && [ -n "$CLIENT_ID" ]; then
            RESPONSE=$(curl -s -X POST https://oauth2.googleapis.com/token \
              -d "client_id=${CLIENT_ID}" \
              -d "client_secret=${CLIENT_SECRET}" \
              -d "refresh_token=${REFRESH_TOKEN}" \
              -d "grant_type=refresh_token")
            ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
            if [ -n "$ACCESS_TOKEN" ] && [ "$ACCESS_TOKEN" != "null" ]; then
              TOKEN_JSON=$(jq -c -n \
                --arg at "$ACCESS_TOKEN" \
                --arg rt "$REFRESH_TOKEN" \
                '{access_token: $at, token_type: "Bearer", refresh_token: $rt, expiry: "2030-01-01T00:00:00Z"}')
              printf "[gdrive]\ntype = drive\nscope = drive\nclient_id = %s\nclient_secret = %s\ntoken = %s\nroot_folder_id = %s\n" \
                "$CLIENT_ID" "$CLIENT_SECRET" "$TOKEN_JSON" "$FOLDER_ID" > ~/.config/rclone/rclone.conf
            fi
          fi
          if [ -f "data/tablebases/atomic/${{ matrix.table }}.checkpoint.bin" ]; then
            zstd -1 -T0 "data/tablebases/atomic/${{ matrix.table }}.checkpoint.bin" -o "data/tablebases/atomic/${{ matrix.table }}.checkpoint.zst"
            rm -f "data/tablebases/atomic/${{ matrix.table }}.checkpoint.bin"
            if [ -f ~/.config/rclone/rclone.conf ]; then
              echo "Uploading compressed checkpoint to Google Drive..."
              rclone copy "data/tablebases/atomic/${{ matrix.table }}.checkpoint.zst" gdrive: --verbose
            fi
          fi
          echo "Triggering next workflow run to resume ${{ matrix.table }}..."
          gh workflow run build_atomic_tb.yml -f table="${{ matrix.table }}"
