name: Build Atomic DTW Tablebase

on:
  workflow_dispatch:
    inputs:
      table:
        description: 'Table to solve, or "ALL" for all 8 Layer-1 pawn 4-piece tables in parallel'
        required: true
        default: 'ALL'

concurrency:
  group: "build-atomic-tb-${{ github.event.inputs.table }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build-tablebase:
    name: Generate ${{ matrix.table }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        table:
          - KQPvK
          - KRPvK
          - KBPvK
          - KNPvK
          - KQvKP
          - KRvKP
          - KBvKP
          - KNvKP

    steps:
      - name: Checkout repository
        if: github.event.inputs.table == 'ALL' || github.event.inputs.table == matrix.table
        uses: actions/checkout@v4

      - name: Set up Rust
        if: github.event.inputs.table == 'ALL' || github.event.inputs.table == matrix.table
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        if: github.event.inputs.table == 'ALL' || github.event.inputs.table == matrix.table
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            tool/atomic_tb_gen/target/
          key: cargo-atomic-tb-${{ runner.os }}-${{ hashFiles('tool/atomic_tb_gen/Cargo.lock') }}
          restore-keys: |
            cargo-atomic-tb-${{ runner.os }}-

      - name: Build Release Binary
        if: github.event.inputs.table == 'ALL' || github.event.inputs.table == matrix.table
        run: |
          cargo build --release --manifest-path tool/atomic_tb_gen/Cargo.toml

      - name: Create Tablebase Output Directory & Download Parents
        if: github.event.inputs.table == 'ALL' || github.event.inputs.table == matrix.table
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/tablebases/atomic/temp
          gh run download 42484601569 -D data/tablebases/atomic/temp || true
          gh run download 42481717145 -D data/tablebases/atomic/temp || true
          find data/tablebases/atomic/temp -name "*.atbd" -exec mv {} data/tablebases/atomic/ \; || true
          rm -rf data/tablebases/atomic/temp
          # Ensure KRRvK is generated if not present
          if [ ! -f data/tablebases/atomic/KRRvK.atbd ]; then
            echo "Generating KRRvK.atbd parent dependency..."
            ./tool/atomic_tb_gen/target/release/atomic_tb_gen KRRvK
          fi
          echo "Current parent tablebases on runner:"
          ls -lh data/tablebases/atomic/*.atbd

      - name: Run Retrograde Solver
        if: github.event.inputs.table == 'ALL' || github.event.inputs.table == matrix.table
        run: |
          ./tool/atomic_tb_gen/target/release/atomic_tb_gen ${{ matrix.table }}

      - name: Upload Tablebase Artifact (.atbd)
        if: github.event.inputs.table == 'ALL' || github.event.inputs.table == matrix.table
        uses: actions/upload-artifact@v4
        with:
          name: atomic-tb-${{ matrix.table }}
          path: data/tablebases/atomic/${{ matrix.table }}.atbd
          retention-days: 90
