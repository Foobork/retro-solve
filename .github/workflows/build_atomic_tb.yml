name: Build Atomic DTW Tablebase

on:
  workflow_dispatch:
    inputs:
      table:
        description: 'Table to solve (e.g. KRPvKQ), or "ALL_5P_1P" (all 26), "5P_1P_BATCH1", "5P_1P_BATCH2", "5P_1P_BLACK", "ALL_5P_QUEEN", "ALL_5P_0P", "ALL_4P"'
        required: true
        default: 'ALL_5P_1P'

concurrency:
  group: "build-atomic-tb-${{ github.event.inputs.table }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  setup:
    name: Setup Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          INPUT="${{ github.event.inputs.table }}"
          if [ "$INPUT" = "ALL_5P_1P" ]; then
            echo 'matrix=["KQPvKQ","KQPvKR","KQPvKB","KQPvKN","KRPvKQ","KRPvKR","KRPvKB","KRPvKN","KBPvKQ","KBPvKR","KBPvKB","KBPvKN","KNPvKQ","KNPvKR","KNPvKB","KNPvKN","KQQvKP","KQRvKP","KQBvKP","KQNvKP","KRRvKP","KRBvKP","KRNvKP","KBBvKP","KBNvKP","KNNvKP"]' >> $GITHUB_OUTPUT
          elif [ "$INPUT" = "5P_1P_BATCH1" ]; then
            echo 'matrix=["KQPvKQ","KQPvKR","KQPvKB","KQPvKN","KRPvKQ","KRPvKR","KRPvKB","KRPvKN"]' >> $GITHUB_OUTPUT
          elif [ "$INPUT" = "5P_1P_BATCH2" ]; then
            echo 'matrix=["KBPvKQ","KBPvKR","KBPvKB","KBPvKN","KNPvKQ","KNPvKR","KNPvKB","KNPvKN"]' >> $GITHUB_OUTPUT
          elif [ "$INPUT" = "5P_1P_BLACK" ] || [ "$INPUT" = "5P_1P_BATCH3" ]; then
            echo 'matrix=["KQQvKP","KQRvKP","KQBvKP","KQNvKP","KRRvKP","KRBvKP","KRNvKP","KBBvKP","KBNvKP","KNNvKP"]' >> $GITHUB_OUTPUT
          elif [ "$INPUT" = "ALL" ] || [ "$INPUT" = "ALL_4P" ]; then
            echo 'matrix=["KQPvK","KRPvK","KBPvK","KNPvK","KQvKP","KRvKP","KBvKP","KNvKP"]' >> $GITHUB_OUTPUT
          elif [ "$INPUT" = "ALL_5P_QUEEN" ] || [ "$INPUT" = "ALL_5P_QUEENS" ]; then
            echo 'matrix=["KQQvKQ","KQQvKR","KQQvKB","KQQvKN","KQRvKQ","KQRvKR","KQRvKB","KQRvKN","KQBvKQ","KQBvKR","KQBvKB","KQBvKN","KQNvKQ","KQNvKR","KQNvKB","KQNvKN","KRRvKQ","KRBvKQ","KRNvKQ","KBBvKQ","KBNvKQ","KNNvKQ"]' >> $GITHUB_OUTPUT
          elif [ "$INPUT" = "QUEEN_BATCH1" ]; then
            echo 'matrix=["KQQvKQ","KQQvKR","KQQvKB","KQQvKN","KQRvKQ","KQRvKR","KQRvKB","KQRvKN"]' >> $GITHUB_OUTPUT
          elif [ "$INPUT" = "QUEEN_BATCH2" ]; then
            echo 'matrix=["KQBvKQ","KQBvKR","KQBvKB","KQBvKN","KQNvKQ","KQNvKR","KQNvKB","KQNvKN"]' >> $GITHUB_OUTPUT
          elif [ "$INPUT" = "QUEEN_BATCH3" ]; then
            echo 'matrix=["KRRvKQ","KRBvKQ","KRNvKQ","KBBvKQ","KBNvKQ","KNNvKQ"]' >> $GITHUB_OUTPUT
          elif [ "$INPUT" = "ALL_5P_0P" ] || [ "$INPUT" = "ALL_5P_MINORS" ]; then
            echo 'matrix=["KRRvKB","KRRvKN","KRBvKR","KRBvKB","KRBvKN","KRNvKR","KRNvKB","KRNvKN","KBBvKR","KBBvKB","KBBvKN","KBNvKR","KBNvKB","KBNvKN","KNNvKR","KNNvKB","KNNvKN"]' >> $GITHUB_OUTPUT
          elif [ "$INPUT" = "REMAINING_3" ] || [ "$INPUT" = "ROOK_ENDINGS" ]; then
            echo 'matrix=["KRBvKB","KRBvKN","KRNvKN"]' >> $GITHUB_OUTPUT
          elif [ "$INPUT" = "ALL_5P_L0" ]; then
            echo 'matrix=["KRRvKR","KQRvKR","KRBvKR","KRNvKR","KRRvKQ","KQRvKQ","KRBvKQ","KRNvKQ","KRRvKB","KQRvKB","KRBvKB","KRNvKB","KRRvKN","KQRvKN","KRBvKN","KRNvKN"]' >> $GITHUB_OUTPUT
          else
            echo "matrix=[\"$INPUT\"]" >> $GITHUB_OUTPUT
          fi

  build-tablebase:
    needs: setup
    name: Generate ${{ matrix.table }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        table: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            tool/atomic_tb_gen/target/
          key: cargo-atomic-tb-${{ runner.os }}-${{ hashFiles('tool/atomic_tb_gen/Cargo.lock') }}
          restore-keys: |
            cargo-atomic-tb-${{ runner.os }}-

      - name: Build Release Binary
        run: |
          cargo build --release --manifest-path tool/atomic_tb_gen/Cargo.toml

      - name: Create Tablebase Output Directory & Download Parents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/tablebases/atomic/temp
          # Query required 5-piece parent table for promotions
          PARENT=$(./tool/atomic_tb_gen/target/release/atomic_tb_gen --parent-table "${{ matrix.table }}" || true)
          if [ -n "$PARENT" ]; then
            echo "Table ${{ matrix.table }} requires 5-piece parent table: $PARENT"
            echo "Downloading atomic-tb-$PARENT from 5-piece Queen run 42814860481..."
            gh run download 42814860481 -n "atomic-tb-$PARENT" -D data/tablebases/atomic/temp || true
          fi
          # Download 3-piece and 4-piece base tables if needed
          gh run download 42484601569 -D data/tablebases/atomic/temp || true
          gh run download 42481717145 -D data/tablebases/atomic/temp || true
          find data/tablebases/atomic/temp -name "*.atbd" -exec mv {} data/tablebases/atomic/ \; || true
          rm -rf data/tablebases/atomic/temp
          echo "Available tablebases on runner:"
          ls -lh data/tablebases/atomic/*.atbd || true

      - name: Run Retrograde Solver
        run: |
          ./tool/atomic_tb_gen/target/release/atomic_tb_gen ${{ matrix.table }}

      - name: Upload Tablebase Artifact (.atbd)
        uses: actions/upload-artifact@v4
        with:
          name: atomic-tb-${{ matrix.table }}
          path: data/tablebases/atomic/${{ matrix.table }}.atbd
          retention-days: 90
