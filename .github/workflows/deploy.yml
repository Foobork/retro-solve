name: Deploy RetroSolve to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup SQLite Web Worker binaries
        run: dart run sqflite_common_ffi_web:setup --dir web

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/retro-solve/"

      - name: Sync Web Workers and Assets to build/web
        run: |
          cp -f web/serve.json build/web/ 2>/dev/null || true
          cp -f web/coi-serviceworker.js build/web/ 2>/dev/null || true
          cp -f web/fairy_stockfish_worker.js build/web/ 2>/dev/null || true
          cp -f web/sqflite_sw.js build/web/ 2>/dev/null || true
          cp -f web/sqlite3.wasm build/web/ 2>/dev/null || true
          cp -f web/stockfish.js build/web/ 2>/dev/null || true
          cp -f web/stockfish.wasm build/web/ 2>/dev/null || true
          cp -f web/stockfish.worker.js build/web/ 2>/dev/null || true
          cp -f web/*.nnue build/web/ 2>/dev/null || true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
