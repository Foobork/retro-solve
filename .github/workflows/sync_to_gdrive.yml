name: Sync Tablebase Artifacts to Google Drive

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'GitHub Actions Run ID whose artifacts to sync'
        required: true
        default: '42963430545'

jobs:
  sync:
    name: Sync Artifacts to Google Drive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure rclone
        env:
          GDRIVE_RCLONE_TOKEN: ${{ secrets.GDRIVE_RCLONE_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          # Write rclone config safely with single-line token
          CLEAN_TOKEN=$(echo "$GDRIVE_RCLONE_TOKEN" | tr -d '\r\n')
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          token = $CLEAN_TOKEN
          root_folder_id = $GDRIVE_FOLDER_ID
          EOF

      - name: Verify Google Drive Connection
        run: |
          echo "Verifying Google Drive access and listing files:"
          rclone lsd gdrive:
          rclone ls gdrive:

      - name: Fetch Artifact List and Stream to Google Drive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          mkdir -p ./tmp_download
          
          # Get list of artifact names starting with atomic-tb-
          ARTIFACTS=$(gh api repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts --paginate --jq '.artifacts[] | select(.name | startswith("atomic-tb-")) | .name')
          
          echo "Found $(echo "$ARTIFACTS" | wc -l) artifacts to transfer."
          
          for art in $ARTIFACTS; do
            echo "=========================================="
            echo "Processing artifact: $art"
            
            # Download single artifact
            gh run download ${RUN_ID} --repo "${GH_REPO}" -n "$art" -D ./tmp_download
            
            # Find the downloaded .atbd file
            TB_FILE=$(find ./tmp_download -name "*.atbd" | head -n 1)
            
            if [ -n "$TB_FILE" ]; then
              FILE_NAME=$(basename "$TB_FILE")
              echo "Uploading $FILE_NAME to Google Drive via User OAuth..."
              # Copy with progress and skip existing
              rclone copy "$TB_FILE" gdrive: --update --verbose
              echo "Uploaded $FILE_NAME successfully!"
            else
              echo "Warning: No .atbd file found in $art"
            fi
            
            # Free up runner disk immediately
            rm -rf ./tmp_download/*
          done
          
          echo "All artifacts synced successfully!"
