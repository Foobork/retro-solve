name: Sync Tablebase Artifacts to Google Drive

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'GitHub Actions Run ID whose artifacts to sync'
        required: true
        default: '42963430545'

jobs:
  sync:
    name: Sync Artifacts to Google Drive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rclone and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone jq curl

      - name: Configure rclone via Fresh OAuth Token
        env:
          CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          
          # Mint a fresh access token directly from Google OAuth endpoint
          RESPONSE=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${CLIENT_ID}" \
            -d "client_secret=${CLIENT_SECRET}" \
            -d "refresh_token=${REFRESH_TOKEN}" \
            -d "grant_type=refresh_token")
            
          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          
          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "Failed to obtain access token:"
            echo "$RESPONSE"
            exit 1
          fi
          
          TOKEN_JSON=$(jq -n \
            --arg at "$ACCESS_TOKEN" \
            --arg rt "$REFRESH_TOKEN" \
            '{access_token: $at, token_type: "Bearer", refresh_token: $rt, expiry: "2030-01-01T00:00:00Z"}')
          
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          client_id = ${CLIENT_ID}
          client_secret = ${CLIENT_SECRET}
          token = ${TOKEN_JSON}
          root_folder_id = ${FOLDER_ID}
          EOF

      - name: Verify Google Drive Connection
        run: |
          echo "Verifying Google Drive access and listing files in target folder:"
          rclone lsd gdrive:
          rclone ls gdrive:

      - name: Fetch Artifact List and Stream to Google Drive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          mkdir -p ./tmp_download
          
          # Get list of artifact names starting with atomic-tb-
          ARTIFACTS=$(gh api repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts --paginate --jq '.artifacts[] | select(.name | startswith("atomic-tb-")) | .name')
          
          echo "Found $(echo "$ARTIFACTS" | wc -l) artifacts to transfer."
          
          for art in $ARTIFACTS; do
            echo "=========================================="
            echo "Processing artifact: $art"
            
            # Download single artifact
            gh run download ${RUN_ID} --repo "${GH_REPO}" -n "$art" -D ./tmp_download
            
            # Find the downloaded .atbd file
            TB_FILE=$(find ./tmp_download -name "*.atbd" | head -n 1)
            
            if [ -n "$TB_FILE" ]; then
              FILE_NAME=$(basename "$TB_FILE")
              echo "Uploading $FILE_NAME to Google Drive via Custom Project OAuth..."
              # Copy with progress and skip existing
              rclone copy "$TB_FILE" gdrive: --update --verbose
              echo "Uploaded $FILE_NAME successfully!"
            else
              echo "Warning: No .atbd file found in $art"
            fi
            
            # Free up runner disk immediately
            rm -rf ./tmp_download/*
          done
          
          echo "All artifacts synced successfully!"
